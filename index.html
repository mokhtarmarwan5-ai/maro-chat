<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق مارو للدردشة الخاصة</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        input, textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
        body { background: #05050a; color: #00ffcc; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        .app-container { width: 100%; max-width: 450px; height: 100%; background: #0b0c15; display: flex; flex-direction: column; overflow: hidden; border: 1px solid rgba(0, 255, 204, 0.2); box-shadow: 0 0 20px rgba(0, 255, 204, 0.1); }
        
        .header { background: #0f1020; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; border-bottom: 2px solid #00ffcc; color: #00ffcc; text-shadow: 0 0 8px rgba(0, 255, 204, 0.6); }
        .screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; display: none; }
        .screen.active { display: flex; }
        
        .auth-box { padding: 30px; display: flex; flex-direction: column; justify-content: center; height: 100%; gap: 20px; }
        .auth-box h2 { color: #00ffcc; text-align: center; text-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }
        .auth-box input { padding: 14px; border-radius: 8px; border: 1px solid #00ffcc; background: #131425; color: #fff; font-size: 16px; outline: none; box-shadow: inset 0 0 8px rgba(0, 255, 204, 0.2); }
        .auth-box button { padding: 14px; background: linear-gradient(45deg, #00ffcc, #0077ff); color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 0 15px rgba(0, 255, 204, 0.4); }

        .users-list { flex: 1; overflow-y: auto; padding: 15px; }
        .user-item { background: #131425; border: 1px solid rgba(0, 255, 204, 0.3); padding: 15px; margin-bottom: 12px; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #fff; box-shadow: 0 0 10px rgba(0, 255, 204, 0.05); transition: 0.3s; }
        .user-item:active { background: #1b1c35; box-shadow: 0 0 15px rgba(0, 255, 204, 0.3); }

        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #07080f; }
        .message { max-width: 75%; padding: 12px 16px; border-radius: 12px; word-wrap: break-word; font-size: 14px; display: flex; flex-direction: column; position: relative; }
        
        .message.sent { background: linear-gradient(135deg, #00bfff, #00ffcc); color: #05050a; align-self: flex-end; border-bottom-left-radius: 2px; box-shadow: 0 0 12px rgba(0, 255, 204, 0.4); font-weight: 500; }
        .message.received { background: #131425; color: #fff; align-self: flex-start; border-bottom-right-radius: 2px; border: 1px solid rgba(0, 191, 255, 0.3); box-shadow: 0 0 10px rgba(0, 191, 255, 0.1); }
        
        .message .sender-name { font-size: 10px; opacity: 0.9; margin-bottom: 4px; font-weight: bold; }
        .message img, .message video { max-width: 100%; border-radius: 8px; margin-top: 5px; border: 1px solid rgba(255,255,255,0.2); }
        .message audio { max-width: 100%; margin-top: 5px; }
        .message-info { font-size: 9px; align-self: flex-end; opacity: 0.8; margin-top: 4px; display: flex; gap: 4px; }
        
        /* شريط الكتابة السفلي الثابت والمنسق بالنيون */
        .chat-input-area { display: flex; padding: 12px; background: #0f1020; border-top: 2px solid #00ffcc; gap: 8px; align-items: center; position: relative; width: 100%; z-index: 10; }
        .chat-input-area input[type="text"] { flex: 1; padding: 12px; border: 1px solid rgba(0, 255, 204, 0.4); background: #131425; color: white; border-radius: 8px; outline: none; font-size: 14px; box-shadow: inset 0 0 5px rgba(0, 255, 204, 0.1); }
        .media-btn { background: #131425; border: 1px solid #00ffcc; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 16px; color: #00ffcc; display: flex; align-items: center; justify-content: center; min-width: 42px; box-shadow: 0 0 8px rgba(0, 255, 204, 0.2); transition: 0.2s; }
        .media-btn:active { background: #00ffcc; color: #000; }
        
        .chat-input-area button.send-btn { background: linear-gradient(45deg, #00ffcc, #0077ff); color: #000; border: none; padding: 12px 18px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; box-shadow: 0 0 12px rgba(0, 255, 204, 0.4); transition: 0.2s; }
        .chat-input-area button.send-btn:active { transform: scale(0.95); }

        .back-btn { background: transparent; border: none; color: #00ffcc; font-size: 14px; cursor: pointer; text-align: right; padding: 10px; font-weight: bold; text-shadow: 0 0 5px rgba(0, 255, 204, 0.4); }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- شاشة تسجيل الدخول -->
        <div id="authScreen" class="screen active">
            <div class="auth-box">
                <h2>تسجيل دخول مارو شات</h2>
                <input type="text" id="usernameInput" placeholder="اكتب اسم المستخدم (يوزر فريد)...">
                <button onclick="login()">دخول للتطبيق</button>
            </div>
        </div>

        <!-- شاشة قائمة المستخدمين -->
        <div id="usersScreen" class="screen">
            <div class="header">قائمة الأشخاص المتاحين</div>
            <div id="usersList" class="users-list"></div>
        </div>

        <!-- شاشة المحادثة الخاصة -->
        <div id="chatScreen" class="screen">
            <button class="back-btn" onclick="goBackToUsers()">← رجوع للقائمة</button>
            <div class="header" id="chatTitle">المحادثة</div>
            <div class="chat-messages" id="messagesList"></div>
            
            <div class="chat-input-area">
                <label class="media-btn" title="صورة">📷<input type="file" accept="image/*" style="display: none;" onchange="sendMedia(this, 'image')"></label>
                <label class="media-btn" title="فيديو">🎥<input type="file" accept="video/*" style="display: none;" onchange="sendMedia(this, 'video')"></label>
                <label class="media-btn" title="ملف صوتي">🎵<input type="file" accept="audio/*" style="display: none;" onchange="sendMedia(this, 'audio')"></label>
                
                <input type="text" id="msgInput" placeholder="اكتب رسالتك هنا...">
                <button class="send-btn" onclick="sendMessage()">إرسال</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, push, onChildAdded, remove, onChildRemoved } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        document.addEventListener('contextmenu', event => event.preventDefault());

        const firebaseConfig = {
            apiKey: "AIzaSyCUs1E0Q4ZmPtCDdBkDVnnZ1maikeq1RIU",
            authDomain: "maro-store-f581b.firebaseapp.com",
            projectId: "maro-store-f581b",
            storageBucket: "maro-store-f581b.appspot.com",
            messagingSenderId: "712885860491",
            appId: "1:712885860491:web:34263ecadff4be8b0e3c8e",
            measurementId: "G-YHQK2FBMHI"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentUser = localStorage.getItem("maro_chat_user") || "";
        let currentChatUser = "";

        window.onload = function() {
            if (currentUser) showUsersScreen();
        };

        window.login = async function() {
            let uInput = document.getElementById("usernameInput").value.trim();
            if (!uInput) { alert("برجاء إدخال اسم المستخدم"); return; }

            let userRef = ref(db, 'users/' + uInput);
            let snapshot = await get(userRef);

            if (snapshot.exists()) {
                let savedOwner = localStorage.getItem("maro_chat_user");
                if (savedOwner !== uInput) {
                    alert("هذا اليوزر مستخدم بالفعل!");
                    return;
                }
            } else {
                await set(userRef, { username: uInput, joined: Date.now() });
            }

            currentUser = uInput;
            localStorage.setItem("maro_chat_user", currentUser);
            showUsersScreen();
        };

        function showUsersScreen() {
            document.getElementById("authScreen").classList.remove("active");
            document.getElementById("chatScreen").classList.remove("active");
            document.getElementById("usersScreen").classList.add("active");
            loadUsers();
        }

        function loadUsers() {
            let listDiv = document.getElementById("usersList");
            let usersRef = ref(db, 'users');
            
            get(usersRef).then((snapshot) => {
                listDiv.innerHTML = "";
                if (snapshot.exists()) {
                    snapshot.forEach((childSnap) => {
                        let uname = childSnap.val().username;
                        if (uname !== currentUser) {
                            let div = document.createElement("div");
                            div.className = "user-item";
                            div.innerHTML = `<span>${uname}</span> 💬`;
                            div.onclick = () => openChat(uname);
                            listDiv.appendChild(div);
                        }
                    });
                }
            });
        }

        window.openChat = function(targetUser) {
            currentChatUser = targetUser;
            document.getElementById("chatTitle").innerText = "محادثة مع: " + targetUser;
            document.getElementById("usersScreen").classList.remove("active");
            document.getElementById("chatScreen").classList.add("active");
            
            let messagesList = document.getElementById("messagesList");
            messagesList.innerHTML = "";
            
            let chatId = [currentUser, targetUser].sort().join("_");
            let chatRef = ref(db, 'chats/' + chatId);

            onChildAdded(chatRef, (snapshot) => {
                let data = snapshot.val();
                let msgId = snapshot.key;
                
                let msgDiv = document.createElement("div");
                msgDiv.className = "message " + (data.sender === currentUser ? "sent" : "received");
                msgDiv.id = "msg_" + msgId;
                
                let contentHTML = `<span class="sender-name">${data.sender}</span>`;
                if (data.type === "image") {
                    contentHTML += `<img src="${data.text}" alt="image">`;
                } else if (data.type === "video") {
                    contentHTML += `<video controls src="${data.text}"></video>`;
                } else if (data.type === "audio") {
                    contentHTML += `<audio controls src="${data.text}"></audio>`;
                } else {
                    contentHTML += `<span>${data.text}</span>`;
                }
                
                contentHTML += `<div class="message-info"><span>✓✓</span></div>`;
                msgDiv.innerHTML = contentHTML;

                msgDiv.ondblclick = () => {
                    if (data.sender === currentUser) {
                        if (confirm("حذف الرسالة للطرفين؟")) {
                            remove(ref(db, 'chats/' + chatId + '/' + msgId));
                        }
                    }
                };

                messagesList.appendChild(msgDiv);
                messagesList.scrollTop = messagesList.scrollHeight;
            });

            onChildRemoved(chatRef, (snapshot) => {
                let msgId = snapshot.key;
                let el = document.getElementById("msg_" + msgId);
                if (el) el.remove();
            });
        };

        window.goBackToUsers = function() {
            document.getElementById("chatScreen").classList.remove("active");
            document.getElementById("usersScreen").classList.add("active");
            loadUsers();
        };

        window.sendMessage = function() {
            let msgInput = document.getElementById("msgInput");
            if (!msgInput.value.trim() || !currentChatUser) return;

            let chatId = [currentUser, currentChatUser].sort().join("_");
            push(ref(db, 'chats/' + chatId), {
                sender: currentUser,
                text: msgInput.value,
                type: "text",
                timestamp: Date.now()
            });

            msgInput.value = "";
        };

        window.sendMedia = function(input, type) {
            if (input.files && input.files[0]) {
                let file = input.files[0];
                let reader = new FileReader();
                reader.onload = function(e) {
                    let chatId = [currentUser, currentChatUser].sort().join("_");
                    push(ref(db, 'chats/' + chatId), {
                        sender: currentUser,
                        text: e.target.result,
                        type: type,
                        timestamp: Date.now()
                    });
                    input.value = ""; 
                };
                reader.readAsDataURL(file);
            }
        };
    </script>
</body>
</html>
