<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق مارو للدردشة المؤمنة</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
        input, textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
        body { background: #05050a; color: #00ffcc; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        .app-container { width: 100%; max-width: 450px; height: 100%; background: #0b0c15; display: flex; flex-direction: column; overflow: hidden; border: 1px solid rgba(0, 255, 204, 0.2); box-shadow: 0 0 20px rgba(0, 255, 204, 0.1); }
        
        .header { background: #0f1020; padding: 12px; text-align: center; font-size: 16px; font-weight: bold; border-bottom: 2px solid #00ffcc; color: #00ffcc; text-shadow: 0 0 8px rgba(0, 255, 204, 0.6); display: flex; justify-content: space-between; align-items: center; }
        .screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; display: none; }
        .screen.active { display: flex; }
        
        .auth-box { padding: 25px; display: flex; flex-direction: column; justify-content: center; height: 100%; gap: 12px; overflow-y: auto; }
        .auth-box h2 { color: #00ffcc; text-align: center; text-shadow: 0 0 10px rgba(0, 255, 204, 0.5); margin-bottom: 5px; }
        .auth-box input[type="text"], .auth-box input[type="password"] { padding: 12px; border-radius: 8px; border: 1px solid #00ffcc; background: #131425; color: #fff; font-size: 15px; outline: none; }
        .auth-box button { padding: 12px; background: linear-gradient(45deg, #00ffcc, #0077ff); color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }

        .profile-pic-upload { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 5px; }
        .profile-preview { width: 75px; height: 75px; border-radius: 50%; border: 2px dashed #00ffcc; background: #131425; display: flex; justify-content: center; align-items: center; overflow: hidden; cursor: pointer; position: relative; }
        .profile-preview img { width: 100%; height: 100%; object-fit: cover; }
        .profile-preview span { font-size: 10px; color: #00ffcc; text-align: center; padding: 4px; }

        .tabs { display: flex; background: #0f1020; border-bottom: 1px solid rgba(0,255,204,0.2); }
        .tab-btn { flex: 1; padding: 10px; background: none; border: none; color: #888; font-weight: bold; cursor: pointer; font-size: 13px; }
        .tab-btn.active { color: #00ffcc; border-bottom: 2px solid #00ffcc; }

        .list-section { flex: 1; overflow-y: auto; padding: 15px; }
        .item-card { background: #131425; border: 1px solid rgba(0, 255, 204, 0.3); padding: 10px 15px; margin-bottom: 10px; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #fff; gap: 10px; }
        
        .user-avatar-sm { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid #00ffcc; background: #0b0c15; }
        .user-info-area { display: flex; align-items: center; gap: 10px; flex: 1; }

        .admin-badge { background: #ef4444; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .action-btn-sm { background: #b91c1c; color: white; border: none; padding: 5px 8px; border-radius: 5px; font-size: 11px; cursor: pointer; }
        .action-btn-green { background: #059669; color: white; border: none; padding: 5px 8px; border-radius: 5px; font-size: 11px; cursor: pointer; }

        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #07080f; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; word-wrap: break-word; font-size: 14px; display: flex; flex-direction: column; position: relative; }
        
        .message.sent { background: linear-gradient(135deg, #00bfff, #00ffcc); color: #05050a; align-self: flex-end; border-bottom-left-radius: 2px; font-weight: 500; }
        .message.received { background: #131425; color: #fff; align-self: flex-start; border-bottom-right-radius: 2px; border: 1px solid rgba(0, 191, 255, 0.3); }
        
        .msg-header-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
        .msg-avatar { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }
        .message .sender-name { font-size: 11px; font-weight: bold; opacity: 0.9; }

        .media-placeholder { background: rgba(0,255,204,0.1); border: 1px dashed #00ffcc; padding: 10px; text-align: center; border-radius: 8px; cursor: pointer; margin-top: 5px; font-size: 12px; color: #00ffcc; }
        .message img { max-width: 100%; max-height: 180px; object-fit: cover; border-radius: 8px; margin-top: 5px; display: block; }
        .message video { max-width: 100%; max-height: 180px; border-radius: 8px; margin-top: 5px; display: block; }
        
        .message-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 9px; opacity: 0.8; gap: 10px; }
        .reactions-container { display: flex; gap: 3px; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 10px; font-size: 12px; margin-top: 4px; width: fit-content; }

        .chat-input-area { background: #0f1020; border-top: 2px solid #00ffcc; padding: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
        .media-toolbar { display: flex; gap: 8px; justify-content: flex-start; border-bottom: 1px solid rgba(0, 255, 204, 0.15); padding-bottom: 8px; }
        .media-btn { background: #131425; border: 1px solid #00ffcc; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; color: #00ffcc; }
        
        .input-row { display: flex; gap: 8px; align-items: center; width: 100%; }
        .chat-input-area input[type="text"] { flex: 1; padding: 10px; border: 1px solid rgba(0, 255, 204, 0.4); background: #131425; color: white; border-radius: 8px; outline: none; font-size: 14px; }
        .chat-input-area button.send-btn { background: linear-gradient(45deg, #00ffcc, #0077ff); color: #000; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; }

        .back-btn { background: transparent; border: none; color: #00ffcc; font-size: 14px; cursor: pointer; padding: 8px; font-weight: bold; }
        .floating-action-btn { position: fixed; bottom: 20px; left: 20px; background: #00ffcc; color: #000; border: none; padding: 12px 18px; border-radius: 30px; font-weight: bold; cursor: pointer; box-shadow: 0 0 15px rgba(0,255,204,0.5); z-index: 100; }

        #actionModal, #groupModal, #addFriendModal, #groupManageModal, #profileEditModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #131425; border: 1px solid #00ffcc; padding: 20px; border-radius: 12px; width: 85%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; }
        .modal-content button { padding: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 13px; }
        .react-picker { display: flex; justify-content: space-around; font-size: 20px; padding: 5px 0; background: #0b0c15; border-radius: 6px; border: 1px solid rgba(0,255,204,0.2); }
        .profile-settings-btn { background: #1f2937; color: #00ffcc; border: 1px solid #00ffcc; padding: 5px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; }
        .logout-btn { background: #7f1d1d; color: #ffcccc; border: 1px solid #ef4444; padding: 5px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- شاشة تسجيل الدخول / إنشاء حساب -->
        <div id="authScreen" class="screen active">
            <div class="auth-box">
                <h2>تسجيل دخول مارو شات</h2>
                
                <div class="profile-pic-upload">
                    <div class="profile-preview" onclick="document.getElementById('profilePicInput').click()">
                        <img id="profilePreviewImg" src="" alt="" style="display:none;">
                        <span id="profilePlaceholderText">صورة شخصية</span>
                    </div>
                    <input type="file" id="profilePicInput" accept="image/*" style="display:none;" onchange="previewProfilePic(this)">
                </div>

                <input type="text" id="usernameInput" placeholder="اسم المستخدم (اليوزر)...">
                <input type="password" id="passwordInput" placeholder="كلمة المرور (الباسورد)...">
                <button onclick="loginOrRegister()">دخول / تسجيل جديد</button>
            </div>
        </div>

        <!-- شاشة الرئيسية -->
        <div id="usersScreen" class="screen">
            <div class="header">
                <span id="welcomeTitle">الدردشة</span>
                <div style="display:flex; gap:5px; align-items:center;">
                    <button class="profile-settings-btn" onclick="openProfileEdit()">حسابي ⚙️</button>
                    <button class="logout-btn" onclick="logout()">خروج 🚪</button>
                    <span id="adminBadgeContainer"></span>
                </div>
            </div>
            <div class="tabs">
                <button class="tab-btn active" id="tabUsers" onclick="switchTab('users')">المحادثات</button>
                <button class="tab-btn" id="tabGroups" onclick="switchTab('groups')">الجروبات</button>
                <button class="tab-btn" id="tabBansBtn" style="display:none;" onclick="switchTab('bans')">المحظورين</button>
            </div>
            <div id="mainList" class="list-section"></div>
            <button class="floating-action-btn" id="floatingBtn" onclick="floatingAction()">+ إضافة صديق</button>
        </div>

        <!-- شاشة المحادثة -->
        <div id="chatScreen" class="screen">
            <div class="header">
                <button class="back-btn" onclick="goBackToUsers()">← رجوع</button>
                <span id="chatTitle">المحادثة</span>
                <span id="chatHeaderExtra"></span>
            </div>
            <div class="chat-messages" id="messagesList"></div>
            
            <div class="chat-input-area">
                <div class="media-toolbar">
                    <label class="media-btn">📷 صورة<input type="file" accept="image/*" style="display: none;" onchange="sendMedia(this, 'image')"></label>
                    <label class="media-btn">🎥 فيديو<input type="file" accept="video/*" style="display: none;" onchange="sendMedia(this, 'video')"></label>
                </div>
                <div class="input-row">
                    <input type="text" id="msgInput" placeholder="اكتب رسالتك هنا...">
                    <button class="send-btn" onclick="sendMessage()">إرسال</button>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة تفاعلات الرسائل -->
    <div id="actionModal" onclick="closeModal(event, 'actionModal')">
        <div class="modal-content" id="modalBox">
            <h4 style="margin: 0; text-align: center; color: #00ffcc;">خيارات الرسالة</h4>
            <div class="react-picker">
                <span onclick="addReaction('❤️')">❤️</span>
                <span onclick="addReaction('😂')">😂</span>
                <span onclick="addReaction('🔥')">🔥</span>
                <span onclick="addReaction('👍')">👍</span>
            </div>
            <hr style="border-color: rgba(0,255,204,0.2);">
            <button style="background: #ef4444; color: white;" onclick="deleteMessageForMe()">حذف عندي أنا فقط 🗑️</button>
            <button style="background: #b91c1c; color: white;" id="deleteEveryoneBtn" onclick="deleteMessageForEveryone()">حذف للطرفين (للكل) ❌</button>
            <button style="background: #334155; color: white;" onclick="closeModalDirect('actionModal')">إلغاء</button>
        </div>
    </div>

    <!-- نافذة إضافة صديق باليوزر -->
    <div id="addFriendModal" onclick="closeModal(event, 'addFriendModal')">
        <div class="modal-content">
            <h3 style="margin:0; color:#00ffcc; text-align:center;">إضافة صديق جديد</h3>
            <input type="text" id="targetUsernameInput" placeholder="اكتب اليوزر الصحيح للصديق..." style="padding:10px; background:#07080f; border:1px solid #00ffcc; color:white; border-radius:6px;">
            <button style="background:#00ffcc; color:#000;" onclick="addFriendByUsername()">إضافة للمحادثات</button>
            <button style="background:#334155; color:white;" onclick="closeModalDirect('addFriendModal')">إلغاء</button>
        </div>
    </div>

    <!-- نافذة إنشاء جروب -->
    <div id="groupModal" onclick="closeModal(event, 'groupModal')">
        <div class="modal-content">
            <h3 style="margin:0; color:#00ffcc; text-align:center;">إنشاء جروب جديد</h3>
            <input type="text" id="groupNameInput" placeholder="اسم الجروب..." style="padding:10px; background:#07080f; border:1px solid #00ffcc; color:white; border-radius:6px;">
            <button style="background:#00ffcc; color:#000;" onclick="createGroup()">إنشاء الجروب</button>
            <button style="background:#334155; color:white;" onclick="closeModalDirect('groupModal')">إلغاء</button>
        </div>
    </div>

    <!-- نافذة إدارة أعضاء الجروب (للمشرف) -->
    <div id="groupManageModal" onclick="closeModal(event, 'groupManageModal')">
        <div class="modal-content" style="max-height: 80vh; overflow-y: auto;">
            <h3 style="margin:0; color:#00ffcc; text-align:center;">إدارة أعضاء الجروب</h3>
            <div id="groupMembersList" style="display:flex; flex-direction:column; gap:5px; margin: 5px 0;"></div>
            <input type="text" id="memberUsernameInput" placeholder="يوزر العضو المراد إضافته..." style="padding:10px; background:#07080f; border:1px solid #00ffcc; color:white; border-radius:6px;">
            <button style="background:#059669; color:white;" onclick="addGroupMember()">إضافة عضو للجروب ➕</button>
            <button style="background:#334155; color:white;" onclick="closeModalDirect('groupManageModal')">إغلاق</button>
        </div>
    </div>

    <!-- نافذة تعديل الحساب والصورة -->
    <div id="profileEditModal" onclick="closeModal(event, 'profileEditModal')">
        <div class="modal-content">
            <h3 style="margin:0; color:#00ffcc; text-align:center;">تعديل الملف الشخصي</h3>
            <div class="profile-pic-upload">
                <div class="profile-preview" onclick="document.getElementById('editPicInput').click()">
                    <img id="editPreviewImg" src="" alt="">
                    <span id="editPlaceholderText" style="display:none;">تغيير الصورة</span>
                </div>
                <input type="file" id="editPicInput" accept="image/*" style="display:none;" onchange="previewEditPic(this)">
            </div>
            <button style="background:#00ffcc; color:#000;" onclick="saveProfileChanges()">حفظ الصورة الجديدة</button>
            <button style="background:#334155; color:white;" onclick="closeModalDirect('profileEditModal')">إلغاء</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, push, onChildAdded, remove, update, onChildChanged, onChildRemoved, limitToLast, query, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        document.addEventListener('contextmenu', event => event.preventDefault());

        const firebaseConfig = {
            apiKey: "AIzaSyCUs1E0Q4ZmPtCDdBkDVnnZ1maikeq1RIU",
            authDomain: "maro-store-f581b.firebaseapp.com",
            projectId: "maro-store-f581b",
            storageBucket: "maro-store-f581b.appspot.com",
            messagingSenderId: "712885860491",
            appId: "1:712885860491:web:34263ecadff4be8b0e3c8e",
            measurementId: "G-YHQK2FBMHI"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        try {
            enableIndexedDbPersistence(db).catch((err) => {});
        } catch(e) {}

        const MASTER_ADMIN = "MaroAdmin";

        let currentUser = localStorage.getItem("maro_chat_user") || "";
        let currentAvatar = localStorage.getItem("maro_chat_avatar") || "";
        let currentTarget = "";
        let isGroupChat = false;
        let selectedMessageId = null;
        let activeTab = "users";
        let tempAvatarBase64 = "";
        let tempEditAvatarBase64 = "";

        window.onload = function() {
            if (currentUser) {
                checkBanAndProceed();
            }
        };

        window.previewProfilePic = function(input) {
            if (input.files && input.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    tempAvatarBase64 = e.target.result;
                    let img = document.getElementById("profilePreviewImg");
                    img.src = tempAvatarBase64;
                    img.style.display = "block";
                    document.getElementById("profilePlaceholderText").style.display = "none";
                };
                reader.readAsDataURL(input.files[0]);
            }
        };

        window.previewEditPic = function(input) {
            if (input.files && input.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    tempEditAvatarBase64 = e.target.result;
                    let img = document.getElementById("editPreviewImg");
                    img.src = tempEditAvatarBase64;
                };
                reader.readAsDataURL(input.files[0]);
            }
        };

        window.loginOrRegister = function() {
            let uInput = document.getElementById("usernameInput").value.trim();
            let pInput = document.getElementById("passwordInput").value.trim();

            if (!uInput || !pInput) {
                alert("برجاء إدخال اسم المستخدم وكلمة المرور!");
                return;
            }

            let userRef = ref(db, 'users/' + uInput);
            get(userRef).then((snapshot) => {
                if (snapshot.exists()) {
                    let userData = snapshot.val();
                    if (userData.password && userData.password !== pInput) {
                        alert("كلمة المرور غير صحيحة لهذا المستخدم!");
                        return;
                    }
                    currentAvatar = userData.avatar || "https://via.placeholder.com/80";
                    completeLogin(uInput);
                } else {
                    let newAvatar = tempAvatarBase64 || "https://via.placeholder.com/80";
                    let newUserData = {
                        username: uInput,
                        password: pInput,
                        avatar: newAvatar,
                        joined: Date.now()
                    };
                    set(userRef, newUserData).then(() => {
                        currentAvatar = newAvatar;
                        completeLogin(uInput);
                    }).catch(() => {
                        completeLogin(uInput); // السماح بالدخول حتى لو النت قاطع لو كان تسجيل محلي
                    });
                }
            }).catch(() => {
                // وضع الأوفلاين عند تسجيل الدخول لو الحساب متسجل قبل كده ع الجهاز
                if(currentUser === uInput || localStorage.getItem("maro_chat_user") === uInput) {
                    completeLogin(uInput);
                } else {
                    alert("لا يمكن التسجيل بحساب جديد بدون اتصال بالإنترنت!");
                }
            });
        };

        function completeLogin(uname) {
            currentUser = uname;
            localStorage.setItem("maro_chat_user", currentUser);
            localStorage.setItem("maro_chat_avatar", currentAvatar);
            showUsersScreen();
        }

        window.logout = function() {
            if (confirm("هل تريد تسجيل الخروج؟")) {
                localStorage.removeItem("maro_chat_user");
                localStorage.removeItem("maro_chat_avatar");
                location.reload();
            }
        };

        function checkBanAndProceed() {
            get(ref(db, 'bans/' + currentUser)).then((snapshot) => {
                if (snapshot.exists() && snapshot.val() === true) {
                    alert("تم حظرك من قِبل الآدمن!");
                    localStorage.removeItem("maro_chat_user");
                    location.reload();
                    return;
                }
                showUsersScreen();
            }).catch(() => {
                showUsersScreen();
            });
        }

        function showUsersScreen() {
            document.getElementById("authScreen").classList.remove("active");
            document.getElementById("chatScreen").classList.remove("active");
            document.getElementById("usersScreen").classList.add("active");
            
            let isAdm = (currentUser === MASTER_ADMIN);
            document.getElementById("welcomeTitle").innerText = "أهلاً، " + currentUser;
            if (isAdm) {
                document.getElementById("adminBadgeContainer").innerHTML = `<span class="admin-badge">👑 الآدمن</span>`;
                document.getElementById("tabBansBtn").style.display = "block";
            }
            loadMainList();
        }

        window.switchTab = function(tab) {
            activeTab = tab;
            document.getElementById("tabUsers").className = "tab-btn " + (tab === 'users' ? 'active' : '');
            document.getElementById("tabGroups").className = "tab-btn " + (tab === 'groups' ? 'active' : '');
            if(document.getElementById("tabBansBtn").style.display !== 'none') {
                document.getElementById("tabBans").className = "tab-btn " + (tab === 'bans' ? 'active' : '');
            }
            
            let floatBtn = document.getElementById("floatingBtn");
            if (tab === 'users') floatBtn.innerText = "+ إضافة صديق";
            else if (tab === 'groups') floatBtn.innerText = "+ إنشاء جروب";
            else floatBtn.style.display = "none";

            if(tab !== 'bans') floatBtn.style.display = "block";

            loadMainList();
        }

        window.floatingAction = function() {
            if (activeTab === 'users') {
                document.getElementById("addFriendModal").style.display = "flex";
            } else if (activeTab === 'groups') {
                document.getElementById("groupModal").style.display = "flex";
            }
        }

        function loadMainList() {
            let listDiv = document.getElementById("mainList");
            listDiv.innerHTML = "";
            let isAdm = (currentUser === MASTER_ADMIN);

            if (activeTab === 'users') {
                let myContactsRef = ref(db, 'contacts/' + currentUser);
                get(myContactsRef).then((snapshot) => {
                    if (snapshot.exists()) {
                        let contacts = snapshot.val();
                        Object.keys(contacts).forEach((friendName) => {
                            renderContactItem(friendName, listDiv, isAdm);
                        });
                    } else {
                        listDiv.innerHTML = "<div style='text-align:center; color:#888; margin-top:20px;'>ليس لديك أصدقاء مضافين. اضغط على (+ إضافة صديق)!</div>";
                    }
                }).catch(() => {
                    // استرجاع الأصدقاء من الذاكرة المحلية عند انقطاع النت
                    let savedContacts = JSON.parse(localStorage.getItem("maro_contacts_" + currentUser) || "{}");
                    if (Object.keys(savedContacts).length > 0) {
                        Object.keys(savedContacts).forEach((friendName) => {
                            renderContactItem(friendName, listDiv, isAdm);
                        });
                    } else {
                        listDiv.innerHTML = "<div style='text-align:center; color:#888; margin-top:20px;'>لا توجد اتصال، ولا توجد جهات اتصال مخزنة مؤقتاً.</div>";
                    }
                });
            } else if (activeTab === 'groups') {
                get(ref(db, 'groups')).then((snapshot) => {
                    if (snapshot.exists()) {
                        let foundAny = false;
                        snapshot.forEach((childSnap) => {
                            let gName = childSnap.key;
                            let gData = childSnap.val();
                            let members = gData.members || {};
                            if (gData.creator === currentUser || members[currentUser]) {
                                foundAny = true;
                                renderGroupItem(gName, listDiv);
                            }
                        });
                        if (!foundAny) {
                            listDiv.innerHTML = "<div style='text-align:center; color:#888; margin-top:20px;'>لست منضماً لأي جروب.</div>";
                        }
                    }
                }).catch(() => {
                    listDiv.innerHTML = "<div style='text-align:center; color:#888; margin-top:20px;'>وضع عدم الاتصال: تعذر جلب الجروبات.</div>";
                });
            } else if (activeTab === 'bans' && isAdm) {
                get(ref(db, 'bans')).then((snapshot) => {
                    if (snapshot.exists()) {
                        snapshot.forEach((childSnap) => {
                            let bUser = childSnap.key;
                            if (childSnap.val()) {
                                let div = document.createElement("div");
                                div.className = "item-card";
                                div.innerHTML = `<div class="user-info-area"><span>⛔ ${bUser}</span></div><button class="action-btn-green" onclick="unbanUser('${bUser}')">رفع الحظر 🔓</button>`;
                                listDiv.appendChild(div);
                            }
                        });
                    }
                });
            }
        }

        function renderContactItem(friendName, listDiv, isAdm) {
            let div = document.createElement("div");
            div.className = "item-card";
            let banBtnHTML = (isAdm && friendName !== MASTER_ADMIN) ? `<button class="action-btn-sm" onclick="banUser(event, '${friendName}')">حظر ⛔</button>` : '';
            div.innerHTML = `
                <div class="user-info-area">
                    <img src="https://via.placeholder.com/40" class="user-avatar-sm" id="avatar_${friendName}" alt="">
                    <span>💬 ${friendName}</span>
                </div>
                ${banBtnHTML}
            `;
            div.onclick = (e) => { if(e.target.tagName !== 'BUTTON') openChat(friendName, false); };
            listDiv.appendChild(div);

            // جلب الأفاتار
            get(ref(db, 'users/' + friendName)).then((userSnap) => {
                if(userSnap.exists() && userSnap.val().avatar) {
                    let imgEl = document.getElementById("avatar_" + friendName);
                    if(imgEl) imgEl.src = userSnap.val().avatar;
                }
            }).catch(()=>{});
        }

        function renderGroupItem(gName, listDiv) {
            let div = document.createElement("div");
            div.className = "item-card";
            div.innerHTML = `
                <div class="user-info-area">
                    <div class="user-avatar-sm" style="display:flex; justify-content:center; align-items:center; background:#131425; font-size:18px;">👥</div>
                    <span>جروب: ${gName}</span>
                </div>
            `;
            div.onclick = () => openChat(gName, true);
            listDiv.appendChild(div);
        }

        window.addFriendByUsername = function() {
            let targetUser = document.getElementById("targetUsernameInput").value.trim();
            if (!targetUser) return;
            if (targetUser === currentUser) {
                alert("لا يمكنك إضافة نفسك!");
                return;
            }

            get(ref(db, 'users/' + targetUser)).then((snapshot) => {
                if (!snapshot.exists()) {
                    alert("خطأ: اليوزر غير موجود!");
                    return;
                }

                set(ref(db, 'contacts/' + currentUser + '/' + targetUser), true).then(() => {
                    // حفظ جهة الاتصال محلياً أيضاً
                    let savedContacts = JSON.parse(localStorage.getItem("maro_contacts_" + currentUser) || "{}");
                    savedContacts[targetUser] = true;
                    localStorage.setItem("maro_contacts_" + currentUser, JSON.stringify(savedContacts));

                    alert("تم إضافة الصديق بنجاح!");
                    document.getElementById('addFriendModal').style.display = 'none';
                    document.getElementById("targetUsernameInput").value = "";
                    loadMainList();
                });
            }).catch(() => {
                alert("لا يمكن إضافة صديق بدون إنترنت!");
            });
        };

        window.banUser = function(e, uname) {
            e.stopPropagation();
            if (confirm(`هل أنت متأكد من حظر المستخدم ${uname}؟`)) {
                set(ref(db, 'bans/' + uname), true).then(() => {
                    alert("تم حظر المستخدم بنجاح.");
                    loadMainList();
                });
            }
        };

        window.unbanUser = function(uname) {
            if (confirm(`هل تريد رفع الحظر عن المستخدم ${uname}؟`)) {
                remove(ref(db, 'bans/' + uname)).then(() => {
                    alert("تم رفع الحظر بنجاح.");
                    loadMainList();
                });
            }
        };

        window.createGroup = function() {
            let gName = document.getElementById("groupNameInput").value.trim();
            if (!gName) return;
            
            let groupData = {
                creator: currentUser,
                created: Date.now(),
                members: {}
            };
            groupData.members[currentUser] = true;

            set(ref(db, 'groups/' + gName + '/info'), groupData).then(() => {
                document.getElementById('groupModal').style.display = 'none';
                document.getElementById("groupNameInput").value = "";
                switchTab('groups');
            }).catch(()=>{
                alert("تعذر إنشاء الجروب بدون إنترنت.");
            });
        };

        window.openChat = function(target, isGroup) {
            currentTarget = target;
            isGroupChat = isGroup;
            document.getElementById("chatTitle").innerText = (isGroup ? "جروب: " : "محادثة: ") + target;
            
            let extraHeader = document.getElementById("chatHeaderExtra");
            extraHeader.innerHTML = "";
            if (isGroup) {
                get(ref(db, 'groups/' + target + '/info/creator')).then((snap) => {
                    if (snap.exists() && snap.val() === currentUser) {
                        extraHeader.innerHTML = `<button class="action-btn-green" style="font-size:11px; padding:4px 8px;" onclick="openGroupManager('${target}')">الأعضاء ⚙️</button>`;
                    }
                }).catch(()=>{});
            }

            document.getElementById("usersScreen").classList.remove("active");
            document.getElementById("chatScreen").classList.add("active");
            
            let messagesList = document.getElementById("messagesList");
            messagesList.innerHTML = "";

            // 1. تحميل الرسائل المخزنة محلياً (Offline Cache) فوراً وعرضها للمستخدم
            let storageKey = "maro_msgs_" + (isGroup ? target : [currentUser, target].sort().join("_"));
            let localMessages = JSON.parse(localStorage.getItem(storageKey) || "{}");
            
            Object.keys(localMessages).forEach((msgId) => {
                appendSingleMessage(msgId, localMessages[msgId], messagesList, false);
            });
            
            // 2. جلب وتحديث الرسائل من قاعدة البيانات (Firebase)
            let chatPath = isGroup ? 'groups/' + target + '/messages' : 'chats/' + [currentUser, target].sort().join("_");
            let chatRef = query(ref(db, chatPath), limitToLast(50));

            onChildAdded(chatRef, (snapshot) => {
                let data = snapshot.val();
                let msgId = snapshot.key;
                if (data) {
                    // حفظ الرسالة محلياً
                    localMessages[msgId] = data;
                    localStorage.setItem(storageKey, JSON.stringify(localMessages));
                    
                    appendSingleMessage(msgId, data, messagesList, true);
                }
            });

            onChildChanged(chatRef, (snapshot) => {
                let data = snapshot.val();
                let msgId = snapshot.key;
                let msgDiv = document.getElementById("msg_" + msgId);
                if (data) {
                    localMessages[msgId] = data;
                    localStorage.setItem(storageKey, JSON.stringify(localMessages));

                    let hiddenFor = data.hiddenFor || [];
                    if (hiddenFor.includes(currentUser)) {
                        if (msgDiv) msgDiv.remove();
                        return;
                    }
                    if (msgDiv) renderMessageContent(msgDiv, data, msgId);
                }
            });

            onChildRemoved(chatRef, (snapshot) => {
                let msgId = snapshot.key;
                delete localMessages[msgId];
                localStorage.setItem(storageKey, JSON.stringify(localMessages));

                let el = document.getElementById("msg_" + msgId);
                if (el) el.remove();
            });
        };

        window.openGroupManager = function(gName) {
            let membersDiv = document.getElementById("groupMembersList");
            membersDiv.innerHTML = "جاري التحميل...";
            document.getElementById("groupManageModal").style.display = "flex";

            get(ref(db, 'groups/' + gName + '/info/members')).then((snapshot) => {
                membersDiv.innerHTML = "";
                if (snapshot.exists()) {
                    let members = snapshot.val();
                    Object.keys(members).forEach((mName) => {
                        let row = document.createElement("div");
                        row.style.cssText = "display:flex; justify-content:space-between; align-items:center; background:#07080f; padding:6px 10px; border-radius:6px; font-size:13px;";
                        let removeBtn = (mName !== currentUser) ? `<button class="action-btn-sm" onclick="removeGroupMember('${gName}', '${mName}')">إزالة ❌</button>` : '<span style="color:#00ffcc; font-size:10px;">(المنشئ)</span>';
                        row.innerHTML = `<span>👤 ${mName}</span> ${removeBtn}`;
                        membersDiv.appendChild(row);
                    });
                }
            }).catch(()=>{
                membersDiv.innerHTML = "تعذر تحميل الأعضاء بدون إنترنت.";
            });
        };

        window.addGroupMember = function() {
            let newMember = document.getElementById("memberUsernameInput").value.trim();
            if (!newMember || !isGroupChat) return;
            
            get(ref(db, 'users/' + newMember)).then((snap) => {
                if (!snap.exists()) {
                    alert("المستخدم غير موجود!");
                    return;
                }
                set(ref(db, 'groups/' + currentTarget + '/info/members/' + newMember), true).then(() => {
                    alert("تمت إضافة العضو بنجاح للجروب!");
                    document.getElementById("memberUsernameInput").value = "";
                    openGroupManager(currentTarget);
                });
            }).catch(()=>{
                alert("خطأ في الاتصال.");
            });
        };

        window.removeGroupMember = function(gName, mName) {
            if (confirm(`هل تريد إزالة العضو ${mName} من الجروب؟`)) {
                remove(ref(db, 'groups/' + gName + '/info/members/' + mName)).then(() => {
                    openGroupManager(gName);
                });
            }
        };

        window.openProfileEdit = function() {
            let img = document.getElementById("editPreviewImg");
            img.src = currentAvatar;
            tempEditAvatarBase64 = currentAvatar;
            document.getElementById("profileEditModal").style.display = "flex";
        };

        window.saveProfileChanges = function() {
            if (tempEditAvatarBase64) {
                currentAvatar = tempEditAvatarBase64;
                localStorage.setItem("maro_chat_avatar", currentAvatar);
                update(ref(db, 'users/' + currentUser), { avatar: currentAvatar }).then(() => {
                    alert("تم تحديث الصورة الشخصية بنجاح!");
                    document.getElementById("profileEditModal").style.display = "none";
                }).catch(() => {
                    alert("تم الحفظ محلياً (لا يوجد إنترنت لتحديثه للخادم حالياً).");
                    document.getElementById("profileEditModal").style.display = "none";
                });
            }
        };

        function appendSingleMessage(msgId, data, container, scrollToBottom) {
            let hiddenFor = data.hiddenFor || [];
            if (hiddenFor.includes(currentUser)) return;

            let existing = document.getElementById("msg_" + msgId);
            if (existing) existing.remove();

            let msgDiv = document.createElement("div");
            msgDiv.className = "message " + (data.sender === currentUser ? "sent" : "received");
            msgDiv.id = "msg_" + msgId;
            
            renderMessageContent(msgDiv, data, msgId);

            msgDiv.onclick = () => {
                selectedMessageId = msgId;
                let isAdm = (currentUser === MASTER_ADMIN);
                let canDeleteEveryone = (data.sender === currentUser || isAdm);
                document.getElementById("deleteEveryoneBtn").style.display = canDeleteEveryone ? "block" : "none";
                document.getElementById("actionModal").style.display = "flex";
            };

            container.appendChild(msgDiv);
            if (scrollToBottom) {
                container.scrollTop = container.scrollHeight;
            }
        }

        function renderMessageContent(msgDiv, data, msgId) {
            let avatarHtml = data.avatar ? `<img src="${data.avatar}" class="msg-avatar" alt="">` : '';
            let contentHTML = `
                <div class="msg-header-row">
                    ${avatarHtml}
                    <span class="sender-name">${data.sender}</span>
                </div>
            `;

            if (data.type === "image") {
                contentHTML += `<div class="media-placeholder" id="media_${msgId}" onclick="loadMedia(event, '${msgId}', 'image', '${data.text}')">📷 اضغط لتحميل الصورة</div>`;
            } else if (data.type === "video") {
                contentHTML += `<div class="media-placeholder" id="media_${msgId}" onclick="loadMedia(event, '${msgId}', 'video', '${data.text}')">🎥 اضغط لتحميل الفيديو</div>`;
            } else {
                contentHTML += `<span>${data.text}</span>`;
            }

            if (data.reactions) {
                let reactHTML = Object.values(data.reactions).join(" ");
                contentHTML += `<div class="reactions-container">${reactHTML}</div>`;
            }
            
            contentHTML += `<div class="message-footer"><span>✓✓</span></div>`;
            msgDiv.innerHTML = contentHTML;
        }

        window.loadMedia = function(event, msgId, type, url) {
            event.stopPropagation();
            let container = document.getElementById("media_" + msgId);
            if (!container) return;
            if (type === "image") {
                container.outerHTML = `<img src="${url}" alt="image">`;
            } else if (type === "video") {
                container.outerHTML = `<video controls autoplay src="${url}"></video>`;
            }
        };

        window.goBackToUsers = function() {
            document.getElementById("chatScreen").classList.remove("active");
            document.getElementById("usersScreen").classList.add("active");
            loadMainList();
        };

        window.sendMessage = function() {
            let msgInput = document.getElementById("msgInput");
            let textVal = msgInput.value.trim();
            if (!textVal || !currentTarget) return;

            let chatPath = isGroupChat ? 'groups/' + currentTarget + '/messages' : 'chats/' + [currentUser, currentTarget].sort().join("_");
            let newMsgRef = push(ref(db, chatPath));
            
            let msgData = {
                sender: currentUser,
                avatar: currentAvatar || "",
                text: textVal,
                type: "text",
                timestamp: Date.now()
            };

            set(newMsgRef, msgData).catch(() => {
                alert("تعذر إرسال الرسالة لعدم وجود اتصال بالإنترنت.");
            });

            msgInput.value = "";
        };

        window.sendMedia = function(input, type) {
            if (input.files && input.files[0]) {
                let file = input.files[0];
                let reader = new FileReader();
                reader.onload = function(e) {
                    let chatPath = isGroupChat ? 'groups/' + currentTarget + '/messages' : 'chats/' + [currentUser, currentTarget].sort().join("_");
                    let newMsgRef = push(ref(db, chatPath));
                    
                    let msgData = {
                        sender: currentUser,
                        avatar: currentAvatar || "",
                        text: e.target.result,
                        type: type,
                        timestamp: Date.now()
                    };

                    set(newMsgRef, msgData).catch(() => {
                        alert("تعذر إرسال الوسائط لعدم وجود إنترنت.");
                    });
                    input.value = ""; 
                };
                reader.readAsDataURL(file);
            }
        };

        window.closeModal = function(e, modalId) {
            if (e.target.id === modalId) document.getElementById(modalId).style.display = "none";
        };
        window.closeModalDirect = function(modalId) { document.getElementById(modalId).style.display = "none"; };

        window.addReaction = function(emoji) {
            if (!selectedMessageId || !currentTarget) return;
            let chatPath = isGroupChat ? 'groups/' + currentTarget + '/messages' : 'chats/' + [currentUser, currentTarget].sort().join("_");
            let userKey = currentUser.replace(/[.#$\/\[\]]/g, "_");
            update(ref(db, `${chatPath}/${selectedMessageId}/reactions`), { [userKey]: emoji }).catch(()=>{});
            document.getElementById("actionModal").style.display = "none";
        };

        window.deleteMessageForMe = function() {
            if (!selectedMessageId || !currentTarget) return;
            let storageKey = "maro_msgs_" + (isGroupChat ? currentTarget : [currentUser, currentTarget].sort().join("_"));
            let localMessages = JSON.parse(localStorage.getItem(storageKey) || "{}");

            if(localMessages[selectedMessageId]) {
                if(!localMessages[selectedMessageId].hiddenFor) localMessages[selectedMessageId].hiddenFor = [];
                if(!localMessages[selectedMessageId].hiddenFor.includes(currentUser)) {
                    localMessages[selectedMessageId].hiddenFor.push(currentUser);
                    localStorage.setItem(storageKey, JSON.stringify(localMessages));
                }
            }

            let chatPath = isGroupChat ? 'groups/' + currentTarget + '/messages' : 'chats/' + [currentUser, currentTarget].sort().join("_");
            let msgRef = ref(db, `${chatPath}/${selectedMessageId}`);
            
            get(msgRef).then((snapshot) => {
                if (snapshot.exists()) {
                    let data = snapshot.val();
                    let hiddenFor = data.hiddenFor || [];
                    if (!hiddenFor.includes(currentUser)) {
                        hiddenFor.push(currentUser);
                        update(msgRef, { hiddenFor: hiddenFor });
                    }
                }
            }).catch(()=>{});

            let el = document.getElementById("msg_" + selectedMessageId);
            if(el) el.remove();
            document.getElementById("actionModal").style.display = "none";
        };

        window.deleteMessageForEveryone = function() {
            if (!selectedMessageId || !currentTarget) return;
            let chatPath = isGroupChat ? 'groups/' + currentTarget + '/messages' : 'chats/' + [currentUser, currentTarget].sort().join("_");
            remove(ref(db, `${chatPath}/${selectedMessageId}`)).catch(()=>{});
            
            let storageKey = "maro_msgs_" + (isGroupChat ? currentTarget : [currentUser, currentTarget].sort().join("_"));
            let localMessages = JSON.parse(localStorage.getItem(storageKey) || "{}");
            delete localMessages[selectedMessageId];
            localStorage.setItem(storageKey, JSON.stringify(localMessages));

            let el = document.getElementById("msg_" + selectedMessageId);
            if(el) el.remove();
            document.getElementById("actionModal").style.display = "none";
        };
    </script>
</body>
</html>
