<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق مارو للدردشة الخاصة</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
        input, textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
        body { background: #05050a; color: #00ffcc; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        .app-container { width: 100%; max-width: 450px; height: 100%; background: #0b0c15; display: flex; flex-direction: column; overflow: hidden; border: 1px solid rgba(0, 255, 204, 0.2); box-shadow: 0 0 20px rgba(0, 255, 204, 0.1); }
        
        .header { background: #0f1020; padding: 12px; text-align: center; font-size: 16px; font-weight: bold; border-bottom: 2px solid #00ffcc; color: #00ffcc; text-shadow: 0 0 8px rgba(0, 255, 204, 0.6); }
        .screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; display: none; }
        .screen.active { display: flex; }
        
        .auth-box { padding: 30px; display: flex; flex-direction: column; justify-content: center; height: 100%; gap: 20px; }
        .auth-box h2 { color: #00ffcc; text-align: center; text-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }
        .auth-box input { padding: 14px; border-radius: 8px; border: 1px solid #00ffcc; background: #131425; color: #fff; font-size: 16px; outline: none; box-shadow: inset 0 0 8px rgba(0, 255, 204, 0.2); }
        .auth-box button { padding: 14px; background: linear-gradient(45deg, #00ffcc, #0077ff); color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 0 15px rgba(0, 255, 204, 0.4); }

        .users-list { flex: 1; overflow-y: auto; padding: 15px; }
        .user-item { background: #131425; border: 1px solid rgba(0, 255, 204, 0.3); padding: 15px; margin-bottom: 12px; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #fff; box-shadow: 0 0 10px rgba(0, 255, 204, 0.05); }
        .user-item:active { background: #1b1c35; box-shadow: 0 0 15px rgba(0, 255, 204, 0.3); }

        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #07080f; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; word-wrap: break-word; font-size: 14px; display: flex; flex-direction: column; position: relative; }
        
        .message.sent { background: linear-gradient(135deg, #00bfff, #00ffcc); color: #05050a; align-self: flex-end; border-bottom-left-radius: 2px; box-shadow: 0 0 10px rgba(0, 255, 204, 0.3); font-weight: 500; }
        .message.received { background: #131425; color: #fff; align-self: flex-start; border-bottom-right-radius: 2px; border: 1px solid rgba(0, 191, 255, 0.3); }
        
        .message .sender-name { font-size: 10px; opacity: 0.9; margin-bottom: 4px; font-weight: bold; }
        .message img { max-width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin-top: 5px; border: 1px solid rgba(255,255,255,0.2); }
        .message video { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 5px; }
        .message audio { max-width: 100%; margin-top: 5px; }
        
        .message-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 9px; opacity: 0.8; gap: 10px; }
        .reactions-container { display: flex; gap: 3px; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 10px; font-size: 12px; margin-top: 4px; width: fit-content; }

        /* منطقة الإدخال العمودية المنظمة وزر الإرسال البارز */
        .chat-input-area { background: #0f1020; border-top: 2px solid #00ffcc; padding: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
        
        .media-toolbar { display: flex; gap: 8px; justify-content: flex-start; border-bottom: 1px solid rgba(0, 255, 204, 0.15); padding-bottom: 8px; }
        .media-btn { background: #131425; border: 1px solid #00ffcc; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; color: #00ffcc; display: flex; align-items: center; gap: 4px; box-shadow: 0 0 5px rgba(0, 255, 204, 0.2); }
        
        .input-row { display: flex; gap: 8px; align-items: center; width: 100%; }
        .chat-input-area input[type="text"] { flex: 1; padding: 10px; border: 1px solid rgba(0, 255, 204, 0.4); background: #131425; color: white; border-radius: 8px; outline: none; font-size: 14px; }
        .chat-input-area button.send-btn { background: linear-gradient(45deg, #00ffcc, #0077ff); color: #000; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; box-shadow: 0 0 10px rgba(0, 255, 204, 0.4); white-space: nowrap; }

        .back-btn { background: transparent; border: none; color: #00ffcc; font-size: 14px; cursor: pointer; text-align: right; padding: 8px; font-weight: bold; text-shadow: 0 0 5px rgba(0, 255, 204, 0.4); }

        /* نافذة الخيارات المنبثقة */
        #actionModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #131425; border: 1px solid #00ffcc; padding: 20px; border-radius: 12px; width: 85%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 0 20px rgba(0, 255, 204, 0.3); }
        .modal-content button { padding: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 13px; }
        .react-picker { display: flex; justify-content: space-around; font-size: 20px; padding: 5px 0; background: #0b0c15; border-radius: 6px; border: 1px solid rgba(0,255,204,0.2); }
        .react-picker span { cursor: pointer; transition: 0.2s; }
        .react-picker span:active { transform: scale(1.3); }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- شاشة تسجيل الدخول -->
        <div id="authScreen" class="screen active">
            <div class="auth-box">
                <h2>تسجيل دخول مارو شات</h2>
                <input type="text" id="usernameInput" placeholder="اكتب اسم المستخدم...">
                <button onclick="login()">دخول للتطبيق</button>
            </div>
        </div>

        <!-- شاشة قائمة المستخدمين -->
        <div id="usersScreen" class="screen">
            <div class="header">قائمة الأشخاص المتاحين</div>
            <div id="usersList" class="users-list"></div>
        </div>

        <!-- شاشة المحادثة الخاصة -->
        <div id="chatScreen" class="screen">
            <button class="back-btn" onclick="goBackToUsers()">← رجوع للقائمة</button>
            <div class="header" id="chatTitle">المحادثة</div>
            <div class="chat-messages" id="messagesList"></div>
            
            <div class="chat-input-area">
                <div class="media-toolbar">
                    <label class="media-btn">📷 صورة<input type="file" accept="image/*" style="display: none;" onchange="sendMedia(this, 'image')"></label>
                    <label class="media-btn">🎥 فيديو<input type="file" accept="video/*" style="display: none;" onchange="sendMedia(this, 'video')"></label>
                    <label class="media-btn">🎵 صوت<input type="file" accept="audio/*" style="display: none;" onchange="sendMedia(this, 'audio')"></label>
                </div>
                <div class="input-row">
                    <input type="text" id="msgInput" placeholder="اكتب رسالتك هنا...">
                    <button class="send-btn" onclick="sendMessage()">إرسال</button>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة تفاعلات وحذف الرسائل -->
    <div id="actionModal" onclick="closeModal(event)">
        <div class="modal-content" id="modalBox">
            <h4 style="margin: 0; text-align: center; color: #00ffcc;">تفاعل مع الرسالة</h4>
            <div class="react-picker">
                <span onclick="addReaction('❤️')">❤️</span>
                <span onclick="addReaction('😂')">😂</span>
                <span onclick="addReaction('🔥')">🔥</span>
                <span onclick="addReaction('👍')">👍</span>
                <span onclick="addReaction('😢')">😢</span>
            </div>
            <hr style="border-color: rgba(0,255,204,0.2); width: 100%;">
            <button style="background: #ef4444; color: white;" onclick="deleteMessageForMe()">حذف عندي أنا فقط 🗑️</button>
            <button style="background: #b91c1c; color: white;" id="deleteEveryoneBtn" onclick="deleteMessageForEveryone()">حذف للطرفين ❌</button>
            <button style="background: #334155; color: white;" onclick="closeModalDirect()">إلغاء</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, push, onChildAdded, remove, update, onChildChanged, onChildRemoved, limitToLast, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        document.addEventListener('contextmenu', event => event.preventDefault());

        const firebaseConfig = {
            apiKey: "AIzaSyCUs1E0Q4ZmPtCDdBkDVnnZ1maikeq1RIU",
            authDomain: "maro-store-f581b.firebaseapp.com",
            projectId: "maro-store-f581b",
            storageBucket: "maro-store-f581b.appspot.com",
            messagingSenderId: "712885860491",
            appId: "1:712885860491:web:34263ecadff4be8b0e3c8e",
            measurementId: "G-YHQK2FBMHI"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentUser = localStorage.getItem("maro_chat_user") || "";
        let currentChatUser = "";
        let selectedMessageId = null;

        window.onload = function() {
            if (currentUser) {
                showUsersScreen();
            }
        };

        window.login = function() {
            let uInput = document.getElementById("usernameInput").value.trim();
            if (!uInput) {
                alert("برجاء إدخال اسم المستخدم");
                return;
            }

            currentUser = uInput;
            localStorage.setItem("maro_chat_user", currentUser);

            try {
                set(ref(db, 'users/' + currentUser), { username: currentUser, joined: Date.now() });
            } catch(e) {}

            showUsersScreen();
        };

        function showUsersScreen() {
            document.getElementById("authScreen").classList.remove("active");
            document.getElementById("chatScreen").classList.remove("active");
            document.getElementById("usersScreen").classList.add("active");
            loadUsers();
        }

        function loadUsers() {
            let listDiv = document.getElementById("usersList");
            let usersRef = ref(db, 'users');
            
            listDiv.innerHTML = "<div class='user-item' onclick=\"openChat('مازن')\"><span>مازن</span> 💬</div>";

            get(usersRef).then((snapshot) => {
                if (snapshot.exists()) {
                    listDiv.innerHTML = "";
                    snapshot.forEach((childSnap) => {
                        let uname = childSnap.val().username;
                        if (uname && uname !== currentUser) {
                            let div = document.createElement("div");
                            div.className = "user-item";
                            div.innerHTML = `<span>${uname}</span> 💬`;
                            div.onclick = () => openChat(uname);
                            listDiv.appendChild(div);
                        }
                    });
                }
            }).catch(() => {});
        }

        window.openChat = function(targetUser) {
            currentChatUser = targetUser;
            document.getElementById("chatTitle").innerText = "محادثة مع: " + targetUser;
            document.getElementById("usersScreen").classList.remove("active");
            document.getElementById("chatScreen").classList.add("active");
            
            let messagesList = document.getElementById("messagesList");
            messagesList.innerHTML = "";
            
            let chatId = [currentUser, targetUser].sort().join("_");
            let chatRef = query(ref(db, 'chats/' + chatId), limitToLast(30)); // سحب آخر 30 رسالة فقط لتوفير النت والسرعة

            // تنظيف أي استماع قديم لمنع التكرار
            messagesList.innerHTML = "";

            onChildAdded(chatRef, (snapshot) => {
                let data = snapshot.val();
                let msgId = snapshot.key;
                if (data && !document.getElementById("msg_" + msgId)) {
                    appendSingleMessage(msgId, data, messagesList);
                }
            });

            onChildChanged(chatRef, (snapshot) => {
                let data = snapshot.val();
                let msgId = snapshot.key;
                let msgDiv = document.getElementById("msg_" + msgId);
                if (data) {
                    let hiddenFor = data.hiddenFor || [];
                    if (hiddenFor.includes(currentUser)) {
                        if (msgDiv) msgDiv.remove();
                        return;
                    }
                    if (msgDiv) renderMessageContent(msgDiv, data);
                }
            });

            onChildRemoved(chatRef, (snapshot) => {
                let msgId = snapshot.key;
                let el = document.getElementById("msg_" + msgId);
                if (el) el.remove();
            });
        };

        function appendSingleMessage(msgId, data, container) {
            let hiddenFor = data.hiddenFor || [];
            if (hiddenFor.includes(currentUser)) return;

            let existing = document.getElementById("msg_" + msgId);
            if (existing) existing.remove();

            let msgDiv = document.createElement("div");
            msgDiv.className = "message " + (data.sender === currentUser ? "sent" : "received");
            msgDiv.id = "msg_" + msgId;
            
            renderMessageContent(msgDiv, data);

            msgDiv.onclick = () => {
                selectedMessageId = msgId;
                document.getElementById("deleteEveryoneBtn").style.display = (data.sender === currentUser) ? "block" : "none";
                document.getElementById("actionModal").style.display = "flex";
            };

            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function renderMessageContent(msgDiv, data) {
            let contentHTML = `<span class="sender-name">${data.sender}</span>`;
            if (data.type === "image") {
                contentHTML += `<img src="${data.text}" alt="image">`;
            } else if (data.type === "video") {
                contentHTML += `<video controls src="${data.text}"></video>`;
            } else if (data.type === "audio") {
                contentHTML += `<audio controls src="${data.text}"></audio>`;
            } else {
                contentHTML += `<span>${data.text}</span>`;
            }

            if (data.reactions) {
                let reactHTML = Object.values(data.reactions).join(" ");
                contentHTML += `<div class="reactions-container">${reactHTML}</div>`;
            }
            
            contentHTML += `<div class="message-footer"><span>✓✓</span></div>`;
            msgDiv.innerHTML = contentHTML;
        }

        window.goBackToUsers = function() {
            document.getElementById("chatScreen").classList.remove("active");
            document.getElementById("usersScreen").classList.add("active");
            loadUsers();
        };

        window.sendMessage = function() {
            let msgInput = document.getElementById("msgInput");
            let textVal = msgInput.value.trim();
            if (!textVal || !currentChatUser) return;

            let chatId = [currentUser, currentChatUser].sort().join("_");
            let newMsgRef = push(ref(db, 'chats/' + chatId));
            
            set(newMsgRef, {
                sender: currentUser,
                text: textVal,
                type: "text",
                timestamp: Date.now()
            });

            msgInput.value = "";
        };

        window.sendMedia = function(input, type) {
            if (input.files && input.files[0]) {
                let file = input.files[0];
                let reader = new FileReader();
                reader.onload = function(e) {
                    let chatId = [currentUser, currentChatUser].sort().join("_");
                    let newMsgRef = push(ref(db, 'chats/' + chatId));
                    
                    set(newMsgRef, {
                        sender: currentUser,
                        text: e.target.result,
                        type: type,
                        timestamp: Date.now()
                    });
                    input.value = ""; 
                };
                reader.readAsDataURL(file);
            }
        };

        window.closeModal = function(e) {
            if (e.target.id === "actionModal") {
                document.getElementById("actionModal").style.display = "none";
            }
        };

        window.closeModalDirect = function() {
            document.getElementById("actionModal").style.display = "none";
        };

        window.addReaction = function(emoji) {
            if (!selectedMessageId || !currentChatUser) return;
            let chatId = [currentUser, currentChatUser].sort().join("_");
            let userKey = currentUser.replace(/[.#$\/\[\]]/g, "_");
            update(ref(db, `chats/${chatId}/${selectedMessageId}/reactions`), { [userKey]: emoji });
            document.getElementById("actionModal").style.display = "none";
        };

        window.deleteMessageForMe = function() {
            if (!selectedMessageId || !currentChatUser) return;
            let chatId = [currentUser, currentChatUser].sort().join("_");
            let msgRef = ref(db, `chats/${chatId}/${selectedMessageId}`);
            
            get(msgRef).then((snapshot) => {
                if (snapshot.exists()) {
                    let data = snapshot.val();
                    let hiddenFor = data.hiddenFor || [];
                    if (!hiddenFor.includes(currentUser)) {
                        hiddenFor.push(currentUser);
                        update(msgRef, { hiddenFor: hiddenFor });
                    }
                }
            });
            document.getElementById("actionModal").style.display = "none";
        };

        window.deleteMessageForEveryone = function() {
            if (!selectedMessageId || !currentChatUser) return;
            let chatId = [currentUser, currentChatUser].sort().join("_");
            remove(ref(db, `chats/${chatId}/${selectedMessageId}`));
            document.getElementById("actionModal").style.display = "none";
        };
    </script>
</body>
</html>
